apiVersion: config.kwok.x-k8s.io/v1alpha1
kind: KwokctlConfiguration
options:
  runtime: binary
  kubeVersion: v1.35.0
  disableKubeControllerManager: true
  manageAllNodes: true
componentsPatches:
  - name: kube-apiserver
    # This is needed to ensure apiserver doesn't scan n/w interfaces
    extraArgs:
      - key: advertise-address
        value: "127.0.0.1"
