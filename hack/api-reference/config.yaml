processor:
  # RE2 regular expressions describing types that should be excluded from the generated documentation.
  ignoreTypes:
    - "ParseError$"
    - "List$"
  # RE2 regular expressions describing type fields that should be excluded from the generated documentation.
  ignoreFields:
    - "TypeMeta"

render:
  # Version of Kubernetes to use when generating links to Kubernetes API documentation.
  kubernetesVersion: "1.29"
  # Types that are not processed by the generator but are referenced by the API types.
  knownTypes:
    - name: Duration
      package: k8s.io/apimachinery/pkg/apis/meta/v1
      link: https://pkg.go.dev/k8s.io/apimachinery/pkg/apis/meta/v1#Duration
    - name: Quantity
      package: k8s.io/apimachinery/pkg/api/resource
      link: https://pkg.go.dev/k8s.io/apimachinery/pkg/api/resource#Quantity
    - name: RawExtension
      package: k8s.io/apimachinery/pkg/runtime
      link: https://pkg.go.dev/k8s.io/apimachinery/pkg/runtime#RawExtension
    - name: UID
      package: k8s.io/apimachinery/pkg/types
      link: https://pkg.go.dev/k8s.io/apimachinery/pkg/types#UID
    - name: IntOrString
      package: k8s.io/apimachinery/pkg/util/intstr
      link: https://pkg.go.dev/k8s.io/apimachinery/pkg/util/intstr#IntOrString
    - name: Duration
      package: time
      link: https://pkg.go.dev/time#Duration
